# Dependabot Autofix Pipeline
# Triggers when Dependabot opens or updates a PR.
# Runs tests, applies compatibility fixes via AI, and posts a visible summary comment.
#
# Prerequisites:
#   1. GH_PAT_TOKEN secret with scopes: repo, workflow
#   2. Dependabot must be configured to open PRs (open-pull-requests-limit > 0)

name: Dependabot Autofix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-autofix:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT_TOKEN }}
          fetch-depth: 0

      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: demo-app
        run: |
          npm install

      - name: Run tests (pre-fix validation)
        id: pre_test
        working-directory: demo-app
        continue-on-error: true
        run: |
          npm test 2>&1 | tee /tmp/pre-test-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run lint check (pre-fix)
        id: pre_lint
        working-directory: demo-app
        continue-on-error: true
        run: |
          npx eslint . 2>&1 | tee /tmp/pre-lint-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: AI compatibility fix (if tests/lint fail)
        if: steps.pre_test.outcome == 'failure' || steps.pre_lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          MODEL: "openai/gpt-4o-mini"
          DEPENDENCY: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail

          # Load the prompt template
          PROMPT_FILE=".github/prompts/dependabot-autofix.md"
          if [ -f "$PROMPT_FILE" ]; then
            SYSTEM_PROMPT=$(cat "$PROMPT_FILE")
          else
            SYSTEM_PROMPT="You are fixing breaking changes from a Dependabot dependency update. Identify the breaking changes and provide fixes."
          fi

          # Gather test/lint failure context
          TEST_OUTPUT=$(cat /tmp/pre-test-output.txt 2>/dev/null | tail -50 || echo "No test output")
          LINT_OUTPUT=$(cat /tmp/pre-lint-output.txt 2>/dev/null | tail -50 || echo "No lint output")

          # Find usages of the updated package
          USAGES=$(grep -r "$DEPENDENCY" demo-app/  --include="*.js" --include="*.ts" --include="*.json" -l 2>/dev/null | head -20 || echo "No direct imports found")

          USER_MSG="A Dependabot PR updated \`${DEPENDENCY}\` from \`${PREV_VERSION}\` to \`${NEW_VERSION}\` (${UPDATE_TYPE} update).

          Tests and/or lint are failing after the update.

          ## Test failures:
          \`\`\`
          ${TEST_OUTPUT}
          \`\`\`

          ## Lint failures:
          \`\`\`
          ${LINT_OUTPUT}
          \`\`\`

          ## Files using this package:
          ${USAGES}

          Please analyze the breaking changes and suggest the exact file edits needed to fix compatibility."

          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_MSG" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ],
              max_tokens: 2048,
              temperature: 0.2
            }')

          RESPONSE=$(curl -sf https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          AI_SUGGESTIONS=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          printf '%s' "$AI_SUGGESTIONS" > /tmp/ai-fix-suggestions.md
          echo "AI suggestions generated ($(wc -c < /tmp/ai-fix-suggestions.md) bytes)"

      - name: Apply ESLint autofix
        if: steps.pre_lint.outcome == 'failure'
        working-directory: demo-app
        run: |
          npx eslint . --fix || true

      - name: Re-run tests (post-fix validation)
        id: post_test
        working-directory: demo-app
        continue-on-error: true
        run: |
          npm test 2>&1 | tee /tmp/post-test-output.txt

      - name: Commit fixes if any changes
        env:
          DEPENDENCY: ${{ steps.metadata.outputs.dependency-names }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          git config user.name "dependabot-autofix[bot]"
          git config user.email "dependabot-autofix[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: update code for ${DEPENDENCY}@${NEW_VERSION} compatibility

          Applied eslint --fix and AI-suggested compatibility changes."
            git push
            echo "FIXES_APPLIED=true" >> "$GITHUB_ENV"
          else
            echo "FIXES_APPLIED=false" >> "$GITHUB_ENV"
          fi

      - name: Post visible summary comment on PR
        uses: actions/github-script@v7
        env:
          DEPENDENCY: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          PRE_TEST: ${{ steps.pre_test.outcome }}
          POST_TEST: ${{ steps.post_test.outcome }}
          FIXES_APPLIED: ${{ env.FIXES_APPLIED }}
        with:
          github-token: ${{ secrets.GH_PAT_TOKEN }}
          script: |
            const fs = require('fs');

            const dep = process.env.DEPENDENCY;
            const prev = process.env.PREV_VERSION;
            const next = process.env.NEW_VERSION;
            const updateType = process.env.UPDATE_TYPE;
            const directory = process.env.DIRECTORY;
            const preTest = process.env.PRE_TEST;
            const postTest = process.env.POST_TEST;
            const fixesApplied = process.env.FIXES_APPLIED === 'true';

            // Try to read AI suggestions if they exist
            let aiSuggestions = '';
            try {
              aiSuggestions = fs.readFileSync('/tmp/ai-fix-suggestions.md', 'utf8');
            } catch (e) {
              // No AI suggestions generated
            }

            const testStatus = preTest === 'success' ? '✅ All tests passing' :
              (postTest === 'success' ? '✅ Tests fixed by autofix' : '⚠️ Tests still failing — manual review required');

            let body = `## 🤖 Dependabot Autofix Summary\n\n`;
            body += `| Field | Value |\n|-------|-------|\n`;
            body += `| **Package** | \`${dep}\` |\n`;
            body += `| **Version** | \`${prev}\` → \`${next}\` |\n`;
            body += `| **Update type** | \`${updateType}\` |\n`;
            body += `| **Directory** | \`${directory}\` |\n`;
            body += `| **Tests** | ${testStatus} |\n`;
            body += `| **Autofix applied** | ${fixesApplied ? '✅ Yes' : '➖ No changes needed'} |\n\n`;

            if (fixesApplied) {
              body += `### Changes Applied\n\n`;
              body += `- \`eslint --fix\` applied to resolve lint issues\n`;
              body += `- Compatibility adjustments for \`${dep}@${next}\`\n\n`;
            }

            if (aiSuggestions) {
              body += `<details><summary>🧠 AI Analysis & Suggestions</summary>\n\n`;
              body += `${aiSuggestions}\n\n`;
              body += `</details>\n\n`;
            }

            body += `---\n`;
            body += `*Generated by [Dependabot Autofix](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Add labels for visibility
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT_TOKEN }}
          script: |
            const labels = ['ai-autofix', 'dependabot'];

            // Ensure labels exist
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'ai-autofix' ? '7057FF' : '0366D6',
                  description: label === 'ai-autofix' ? 'AI applied compatibility fixes' : 'Dependabot dependency update'
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

      - name: Request review if tests still failing
        if: steps.post_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-manual-review']
            });
